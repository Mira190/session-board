<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Board</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Session Board</h1>
  <p id="summary" aria-live="polite"></p>
  <div class="tools">
    <div class="seg" role="group" aria-label="视图">
      <button id="view-inbox" aria-pressed="true">处理台</button>
      <button id="view-board" aria-pressed="false">看板</button>
    </div>
    <button id="backfill" title="把装 hooks 之前就存在的会话从历史文件里导入进来">导入历史</button>
    <label><input type="checkbox" id="notify"> 桌面通知</label>
    <label><input type="checkbox" id="sound"> 提示音</label>
    <span id="conn" class="conn">连接中…</span>
  </div>
</header>
<main id="app" data-view="inbox">
  <nav id="lists" aria-label="会话"></nav>
  <section id="bench" aria-live="polite"></section>
</main>
<footer><kbd>N</kbd> 下一个等你的 <kbd>A</kbd> 允许 <kbd>D</kbd> 拒绝 <kbd>E</kbd> 已验收 <kbd>R</kbd> 回复</footer>
<script type="module" src="/app.js"></script>
</body>
</html>
